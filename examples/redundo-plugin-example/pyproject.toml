[project]
name = "redundo-plugin-example"
version = "0.1.0"
description = "A minimal, real, working example of all three redundo plugin points -- an adapter source, an analysis, and a report format. See docs/plugins.md for the walkthrough this package exists to back up."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["redundo"]

[project.entry-points."redundo.adapter.sources"]
example = "redundo_plugin_example.source:ExampleSource"

[project.entry-points."redundo.analyzer.analyses"]
count = "redundo_plugin_example.analysis:CountAnalysis"

[project.entry-points."redundo.analyzer.report_formats"]
csv = "redundo_plugin_example.report_format:to_csv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redundo_plugin_example"]
