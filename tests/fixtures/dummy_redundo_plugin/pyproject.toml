[project]
name = "dummy-redundo-plugin"
version = "0.0.0"
description = "Test-only fixture proving redundo's entry-point discovery actually works end to end -- not a real, published plugin."
requires-python = ">=3.10"
dependencies = []

[project.entry-points."redundo.adapter.sources"]
dummy = "dummy_redundo_plugin:DummySource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dummy_redundo_plugin"]
