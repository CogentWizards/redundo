[project]
name = "redundo"
version = "0.1.0"
description = "Point it at your agent's OTLP traces, get a report on what's wasted. redundo adapt normalizes traces from Hermes/OpenInference, Claude Code, Claude Cowork, or OpenClaw into one schema; redundo analyze classifies repeated LLM/tool calls as confirmed waste, likely legitimate, or unclassified."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cogent AI" }]
keywords = ["opentelemetry", "otlp", "observability", "ai-agents", "llm", "tracing", "cost-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# Only needed for `redundo collect`, the convenience local OTLP receiver --
# `adapt` and `analyze` proper have zero dependencies.
collector = ["opentelemetry-proto>=1.20", "protobuf>=4.0"]

[project.urls]
Homepage = "https://github.com/CogentWizards/redundo"
Repository = "https://github.com/CogentWizards/redundo"
Issues = "https://github.com/CogentWizards/redundo/issues"

[project.scripts]
redundo = "redundo.cli:main"

[project.entry-points."redundo.adapter.sources"]
claude-code   = "redundo.adapter.sources.claude_code:ClaudeCodeSource"
cowork        = "redundo.adapter.sources.cowork:CoworkSource"
openclaw      = "redundo.adapter.sources.openclaw:OpenClawSource"
openinference = "redundo.adapter.sources.openinference:OpenInferenceSource"

[project.entry-points."redundo.analyzer.analyses"]
waste = "redundo.analyzer.analyses.waste:WasteAnalysis"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redundo"]

[tool.uv.sources]
dummy-redundo-plugin = { path = "tests/fixtures/dummy_redundo_plugin", editable = true }

[dependency-groups]
dev = ["pytest>=8.0", "dummy-redundo-plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
